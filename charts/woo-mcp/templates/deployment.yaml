apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: woo-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: STORE_URL
              value: {{ .Values.storeUrl | quote }}
            {{- if .Values.storeHostHeader }}
            - name: STORE_HOST_HEADER
              value: {{ .Values.storeHostHeader | quote }}
            {{- end }}
            - name: WC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-wc
                  key: WC_KEY
            - name: WC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-wc
                  key: WC_SECRET
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}