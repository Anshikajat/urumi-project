# MariaDB accepts connections only from WordPress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-only-from-wordpress
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress
      ports:
        - protocol: TCP
          port: 3306
---
# WordPress accepts traffic only from Traefik (storefront) and from the woo-mcp server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-from-traefik-and-woo-mcp
spec:
  podSelector:
    matchLabels:
      app: wordpress
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp
          podSelector:
            matchLabels:
              app: woo-mcp
      ports:
        - protocol: TCP
          port: 80